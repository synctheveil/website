{{ define "main" }}
<main id="main">
  <section id="factions" class="factions-section factions-page" aria-labelledby="factions-title">
    <h1 id="factions-title">Choose your covenant</h1>
    <div class="faction-list" role="list">
      <button class="faction helix active" type="button" data-faction="helix" aria-pressed="true">
        <span class="faction-number">01</span><span class="faction-mark" aria-hidden="true">H</span><span><b>Helix Dominion</b><small>Control. Denial. Infrastructure.</small></span><i aria-hidden="true">→</i>
      </button>
      <button class="faction neon" type="button" data-faction="neon" aria-pressed="false">
        <span class="faction-number">02</span><span class="faction-mark" aria-hidden="true">N</span><span><b>Neon Saints</b><small>Mobility. Tempo. Rebellion.</small></span><i aria-hidden="true">→</i>
      </button>
      <button class="faction ashen" type="button" data-faction="ashen" aria-pressed="false">
        <span class="faction-number">03</span><span class="faction-mark" aria-hidden="true">A</span><span><b>Ashen Court</b><small>Sacrifice. Recursion. Contracts.</small></span><i aria-hidden="true">→</i>
      </button>
      <button class="faction null" type="button" data-faction="null" aria-pressed="false">
        <span class="faction-number">04</span><span class="faction-mark" aria-hidden="true">Ø</span><span><b>Null Assembly</b><small>Adaptation. Modules. Machine minds.</small></span><i aria-hidden="true">→</i>
      </button>
    </div>
    <div class="faction-stage" data-faction-stage aria-live="polite">
      <div class="faction-portrait" aria-hidden="true"></div>
      <div><span data-faction-label>Helix Dominion</span><h2 data-faction-title>Own the infrastructure.<br />Own the outcome.</h2><p data-faction-copy>Build an immaculate machine of taxes, durable constructs, and inevitable control.</p></div>
    </div>
  </section>
</main>
{{ end }}
