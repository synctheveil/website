{{ define "main" }}
    <main id="main">
      <section id="top" class="hero" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true"></div>
        <div class="hero-copy">
          <h1 id="hero-title">One city.<br />Two realities.</h1>
          <div class="signal-rule" aria-hidden="true"><span></span><i></i></div>
          <p>Deploy operatives. Shift between Street and Veil. Control both sides of the city before your rival does.</p>
          <div class="hero-actions">
            <a class="button button-primary" href="{{ "/game/" | relURL }}">Discover the game <span aria-hidden="true">→</span></a>
            <a class="text-link" href="{{ "/how-to-play/" | relURL }}">Read the rules <span aria-hidden="true">→</span></a>
          </div>
        </div>
        <div class="layer-dial" aria-label="The battlefield has two connected layers">
          <span class="street">Street</span><i></i><b></b><i></i><span class="veil">Veil</span>
        </div>
      </section>

    </main>

{{ end }}
